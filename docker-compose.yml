# Local preview only. On Coolify, deploy the Dockerfile and set the env vars in the UI.
services:
  assets:
    build: .
    ports:
      - "3004:3004"
    environment:
      PORT: "3004"
      NODE_ENV: development
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-only-not-for-coolify}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3004}
      STORAGE_DIR: /data
    volumes:
      - assets-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3004)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  assets-data:
